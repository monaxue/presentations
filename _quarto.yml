#background-colors:
#  - "rgba(237, 251, 255, 1)" # blue
#  - "rgba(246, 252, 237, 1)" # green
#  - "rgba(254, 248, 237, 1)" # tan
#  - "rgba(252, 237, 247, 1)" # purple

containers-auto-animate: false
containers-bg-default: "rgba(254, 248, 237, 1)"
format:
  containerstheme-revealjs:
    margin: 0.05
    incremental: true
    self-contained: false #must be false if want to use the white board
    #chalkboard: false
      #theme: whiteboard
    preview-links: true
    title-slide-attributes:
        data-state: "hide-menubar"
    section-divs: false
    menu: false
    simplemenu:
      flat: true
      barhtml:
        header: "<div class='menubar'><ul class='menu'></ul></div>"
      scale: 0.70
    filters:
      - patches/iframe.lua
      - patches/filelink.lua
      - custom-callout
      - d2
d2:
  format: svg
  embed_mode: raw
revealjs-plugins:
  - simplemenu
  - tabset
  - containerstheme
bibliography: "My Library.bib"
custom-callout: 
  quote: 
    color: "green"
    icon: true
    icon-symbol: "fa-quote-left" 