title: Containers Theme
author: Mona Xue
version: 1.1.0
quarto-required: ">=1.7.0"
contributes:
  formats:
    revealjs:
      theme: [default, containers.scss]
      center: true
      scrollable: true
      touch: true
      transition: none
      smaller: true
      filters:
      - column-card.lua
      - containers-bake.lua
      - containers-animate.lua
  revealjs-plugins:
    - name: ContainersScrollable
      script:
        - containers-scrollable.js
